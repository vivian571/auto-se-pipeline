[project]
name = "auto-se-pipeline"
version = "0.1.0"
description = "Autonomous Software Engineering Pipeline for GitHub Issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tiktoken>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
